<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Degree Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #c8f04a;
    --accent2: #4af0c8;
    --text: #f0f0f0;
    --muted: #666;
    --danger: #f04a4a;
    --A: #c8f04a;
    --B: #4af0c8;
    --C: #f0c84a;
    --D: #f07a4a;
    --F: #f04a4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 2rem;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 3rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1px;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  /* Stats bar */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.2rem 1.5rem;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
  }

  .stat-card:nth-child(2)::before { background: var(--accent2); }
  .stat-card:nth-child(3)::before { background: #f0c84a; }
  .stat-card:nth-child(4)::before { background: #c84af0; }

  .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
  }

  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
  }

  /* Layout */
  .main {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 2rem;
    align-items: start;
  }

  /* Add course form */
  .form-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.5rem;
    position: sticky;
    top: 2rem;
  }

  .panel-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 1.5rem;
  }

  .field {
    margin-bottom: 1rem;
  }

  label {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    padding: 0.6rem 0.8rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus {
    border-color: var(--accent);
  }

  select option { background: var(--bg); }

  .btn {
    width: 100%;
    padding: 0.8rem;
    background: var(--accent);
    color: #0e0e0e;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }

  .btn:hover { opacity: 0.85; }
  .btn:active { transform: scale(0.98); }

  /* Courses panel */
  .courses-panel {}

  .semester-block {
    margin-bottom: 2rem;
  }

  .semester-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 1rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    margin-bottom: 0.5rem;
  }

  .semester-name {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent2);
  }

  .semester-gpa {
    font-size: 0.7rem;
    color: var(--muted);
  }

  .course-row {
    display: grid;
    grid-template-columns: 1fr 60px 60px 80px 36px;
    gap: 0.5rem;
    align-items: center;
    padding: 0.7rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    transition: background 0.15s;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .course-row:hover { background: var(--surface2); }

  .course-name {
    font-size: 0.85rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .course-credits {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }

  .course-status {
    font-size: 0.65rem;
    text-align: center;
  }

  .status-done {
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .status-pending {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .grade-badge {
    font-size: 0.75rem;
    font-weight: 500;
    text-align: center;
    padding: 0.2rem 0.4rem;
    letter-spacing: 1px;
  }

  .grade-A { color: var(--A); border: 1px solid var(--A); }
  .grade-B { color: var(--B); border: 1px solid var(--B); }
  .grade-C { color: var(--C); border: 1px solid var(--C); }
  .grade-D { color: var(--D); border: 1px solid var(--D); }
  .grade-F { color: var(--F); border: 1px solid var(--F); }
  .grade-IP { color: var(--muted); border: 1px solid var(--border); }

  .delete-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 28px; height: 28px;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: monospace;
  }

  .delete-btn:hover {
    border-color: var(--danger);
    color: var(--danger);
  }

  .empty-state {
    padding: 2rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px dashed var(--border);
  }

  .col-headers {
    display: grid;
    grid-template-columns: 1fr 60px 60px 80px 36px;
    gap: 0.5rem;
    padding: 0.4rem 1rem;
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .col-headers span { text-align: center; }
  .col-headers span:first-child { text-align: left; }

  /* GPA progress bar */
  .gpa-bar-wrap {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  .gpa-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
  }

  .gpa-bar-track {
    height: 4px;
    background: var(--border);
    position: relative;
  }

  .gpa-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s ease;
  }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .form-panel { position: static; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Degree <span>Planner</span></h1>
    <p class="subtitle">Academic Progress Tracker</p>
  </div>
  <div style="text-align:right">
    <div class="subtitle" id="degree-label">BSc Computer Science</div>
    <div style="font-size:0.75rem;color:var(--muted);margin-top:0.3rem" id="last-updated"></div>
  </div>
</header>

<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Cumulative GPA</div>
    <div class="stat-value" id="stat-gpa">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Credits Completed</div>
    <div class="stat-value" id="stat-credits">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Total Courses</div>
    <div class="stat-value" id="stat-courses">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Credits Remaining</div>
    <div class="stat-value" id="stat-remaining">120</div>
  </div>
</div>

<div class="main">

  <!-- Form -->
  <div class="form-panel">
    <div class="panel-title">+ Add Course</div>

    <div class="field">
      <label>Course Name</label>
      <input type="text" id="inp-name" placeholder="e.g. Introduction to Python" />
    </div>

    <div class="field">
      <label>Credits</label>
      <input type="number" id="inp-credits" placeholder="3" min="1" max="12" />
    </div>

    <div class="field">
      <label>Year</label>
      <select id="inp-year">
        <option value="Year 1">Year 1</option>
        <option value="Year 2">Year 2</option>
        <option value="Year 3">Year 3</option>
        <option value="Year 4">Year 4</option>
      </select>
    </div>

    <div class="field">
      <label>Semester</label>
      <select id="inp-sem">
        <option value="Semester 1">Semester 1</option>
        <option value="Semester 2">Semester 2</option>
        <option value="Summer">Summer</option>
      </select>
    </div>

    <div class="field">
      <label>Grade</label>
      <select id="inp-grade">
        <option value="IP">In Progress</option>
        <option value="A">A (4.0)</option>
        <option value="A-">A- (3.7)</option>
        <option value="B+">B+ (3.3)</option>
        <option value="B">B (3.0)</option>
        <option value="B-">B- (2.7)</option>
        <option value="C+">C+ (2.3)</option>
        <option value="C">C (2.0)</option>
        <option value="C-">C- (1.7)</option>
        <option value="D+">D+ (1.3)</option>
        <option value="D">D (1.0)</option>
        <option value="F">F (0.0)</option>
      </select>
    </div>

    <button class="btn" onclick="addCourse()">Add Course</button>

    <div class="gpa-bar-wrap">
      <div class="gpa-bar-label">
        <span>GPA Progress</span>
        <span id="gpa-bar-val">0.00 / 4.00</span>
      </div>
      <div class="gpa-bar-track">
        <div class="gpa-bar-fill" id="gpa-bar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- Courses -->
  <div class="courses-panel" id="courses-panel">
    <div class="empty-state">No courses yet — add your first course</div>
  </div>

</div>

<script>
  const GRADE_POINTS = {
    'A': 4.0, 'A-': 3.7,
    'B+': 3.3, 'B': 3.0, 'B-': 2.7,
    'C+': 2.3, 'C': 2.0, 'C-': 1.7,
    'D+': 1.3, 'D': 1.0,
    'F': 0.0, 'IP': null
  };

  let courses = JSON.parse(localStorage.getItem('degree-planner-courses') || '[]');

  function save() {
    localStorage.setItem('degree-planner-courses', JSON.stringify(courses));
  }

  function gradeClass(grade) {
    if (!grade || grade === 'IP') return 'grade-IP';
    const first = grade[0];
    return 'grade-' + first;
  }

  function calcGPA(list) {
    const graded = list.filter(c => c.grade !== 'IP' && GRADE_POINTS[c.grade] !== null);
    if (!graded.length) return null;
    const totalPoints = graded.reduce((s, c) => s + GRADE_POINTS[c.grade] * c.credits, 0);
    const totalCredits = graded.reduce((s, c) => s + c.credits, 0);
    return totalCredits ? (totalPoints / totalCredits).toFixed(2) : null;
  }

  function addCourse() {
    const name = document.getElementById('inp-name').value.trim();
    const credits = parseInt(document.getElementById('inp-credits').value);
    const year = document.getElementById('inp-year').value;
    const sem = document.getElementById('inp-sem').value;
    const grade = document.getElementById('inp-grade').value;

    if (!name) { document.getElementById('inp-name').focus(); return; }
    if (!credits || credits < 1) { document.getElementById('inp-credits').focus(); return; }

    courses.push({ id: Date.now(), name, credits, semester: `${year} — ${sem}`, grade });
    save();
    render();

    document.getElementById('inp-name').value = '';
    document.getElementById('inp-credits').value = '';
    document.getElementById('inp-grade').value = 'IP';
  }

  function deleteCourse(id) {
    courses = courses.filter(c => c.id !== id);
    save();
    render();
  }

  function render() {
    // Update stats
    const completed = courses.filter(c => c.grade !== 'IP');
    const totalCredits = completed.reduce((s, c) => s + c.credits, 0);
    const gpa = calcGPA(courses);

    document.getElementById('stat-gpa').textContent = gpa || '—';
    document.getElementById('stat-credits').textContent = totalCredits;
    document.getElementById('stat-courses').textContent = courses.length;
    document.getElementById('stat-remaining').textContent = Math.max(0, 120 - totalCredits);

    // GPA bar
    const gpaVal = gpa || 0;
    document.getElementById('gpa-bar').style.width = ((gpaVal / 4.0) * 100) + '%';
    document.getElementById('gpa-bar-val').textContent = (gpa || '0.00') + ' / 4.00';

    // Update timestamp
    if (courses.length) {
      document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleDateString();
    }

    // Group by semester
    const panel = document.getElementById('courses-panel');

    if (!courses.length) {
      panel.innerHTML = '<div class="empty-state">No courses yet — add your first course</div>';
      return;
    }

    const grouped = {};
    const order = [];
    courses.forEach(c => {
      if (!grouped[c.semester]) {
        grouped[c.semester] = [];
        order.push(c.semester);
      }
      grouped[c.semester].push(c);
    });

    // Sort semesters
    order.sort();

    let html = '';
    order.forEach(sem => {
      const semCourses = grouped[sem];
      const semGPA = calcGPA(semCourses);
      const semCredits = semCourses.filter(c => c.grade !== 'IP').reduce((s, c) => s + c.credits, 0);

      html += `
        <div class="semester-block">
          <div class="semester-header">
            <span class="semester-name">${sem}</span>
            <span class="semester-gpa">
              ${semCredits} cr &nbsp;|&nbsp; GPA: ${semGPA || '—'}
            </span>
          </div>
          <div class="col-headers">
            <span>Course</span>
            <span>Credits</span>
            <span>Status</span>
            <span>Grade</span>
            <span></span>
          </div>
      `;

      semCourses.forEach(c => {
        const isComplete = c.grade !== 'IP';
        html += `
          <div class="course-row">
            <span class="course-name" title="${c.name}">${c.name}</span>
            <span class="course-credits" style="text-align:center">${c.credits}</span>
            <span class="course-status ${isComplete ? 'status-done' : 'status-pending'}">
              ${isComplete ? 'Done' : 'Active'}
            </span>
            <span class="grade-badge ${gradeClass(c.grade)}">${c.grade}</span>
            <button class="delete-btn" onclick="deleteCourse(${c.id})">×</button>
          </div>
        `;
      });

      html += `</div>`;
    });

    panel.innerHTML = html;
  }

  // Allow Enter key to add course
  document.getElementById('inp-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') addCourse();
  });

  render();
</script>
</body>
</html>
